<div class="flex h-full flex-col">
  <div class="flex flex-wrap items-center justify-between gap-4 px-6 pt-6 pb-4">
    <div>
      <h1 class="text-xl font-semibold">Schedule</h1>
      <p class="text-sm text-slate-500">
        @if (teamContext.allTeams()) {
          All teams
        } @else if (teamContext.team(); as team) {
          {{ team.name }} team
        }
      </p>
    </div>
    <app-grid-toolbar [(start)]="start" [(weeks)]="weeks" />
  </div>

  @if (schedule.error()) {
    <p class="px-6 text-sm text-red-600">The schedule could not be loaded. Refresh the page to try again.</p>
  } @else if (data(); as data) {
    <div
      class="mx-6 mb-6 min-h-0 flex-1 overflow-auto rounded-lg border border-slate-200 bg-white transition-opacity"
      [class.opacity-60]="schedule.isLoading()"
    >
      <app-capacity-grid [schedule]="data" [today]="today" />
    </div>
  } @else {
    <p class="px-6 text-sm text-slate-500">Loading the schedule...</p>
  }
</div>
