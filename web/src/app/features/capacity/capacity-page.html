<div class="flex h-full flex-col">
  <div class="flex flex-wrap items-end justify-between gap-4 px-8 pt-2 pb-6">
    <div>
      <h1 class="page-title">Schedule</h1>
      <p class="mt-1 text-sm text-ink-muted">
        @if (teamContext.allTeams()) {
          All teams
        } @else if (teamContext.team(); as team) {
          {{ team.name }} team
        }
      </p>
    </div>
    <app-grid-toolbar [(start)]="start" [(weeks)]="weeks" />
  </div>

  @if (schedule.error()) {
    <p class="empty-state mx-8 text-over-700">The schedule could not be loaded. Refresh the page to try again.</p>
  } @else if (data(); as data) {
    <div
      class="panel scroll-thin mx-8 mb-8 min-h-0 overflow-auto transition-opacity"
      [class.opacity-60]="schedule.isLoading()"
    >
      <app-capacity-grid [schedule]="data" [today]="today" />
    </div>
  } @else {
    <p class="empty-state mx-8">Loading the schedule...</p>
  }
</div>
