<header class="flex h-18 items-center justify-between bg-page px-8">
  <div>
    <!-- Only on team pages: the request pages are not about one team (the form starts on the last team viewed). -->
    @if (auth.teams().length > 0 && teamContext.page()) {
      <app-team-switcher />
    }
  </div>

  @if (auth.me(); as me) {
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3">
        <app-avatar [name]="me.name" [colour]="me.avatarColour" />
        <div class="leading-tight">
          <div class="text-sm font-semibold">{{ me.name }}</div>
          <div class="text-xs text-ink-muted">{{ auth.roleName() }}</div>
        </div>
      </div>
      <button type="button" class="btn-pill" (click)="switchUser()">Switch user</button>
    </div>
  }
</header>
