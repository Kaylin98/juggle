<header class="flex h-14 items-center justify-between border-b border-slate-200 bg-white px-6">
  <div>
    @if (auth.teams().length > 0) {
      <app-team-switcher />
    }
  </div>

  @if (auth.me(); as me) {
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-3">
        <app-avatar [name]="me.name" [colour]="me.avatarColour" />
        <div class="leading-tight">
          <div class="text-sm font-medium">{{ me.name }}</div>
          <div class="text-xs text-slate-500">{{ auth.roleLabel() }}</div>
        </div>
      </div>
      <button type="button" class="btn-secondary" (click)="switchUser()">Switch user</button>
    </div>
  }
</header>
