<nav class="flex h-full w-56 flex-col border-r border-slate-200 bg-white">
  <div class="flex h-14 items-center gap-2.5 border-b border-slate-200 px-5">
    <img [src]="branding.logoUrl" alt="" class="size-7" />
    <span class="text-base font-semibold tracking-tight">{{ branding.productName }}</span>
  </div>

  <ul class="flex flex-col gap-0.5 p-3">
    @for (item of items(); track item.label) {
      <li>
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-accent-50 text-accent-700"
          class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
        >
          <svg class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
