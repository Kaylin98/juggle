<nav class="flex h-full w-60 flex-col bg-page px-4">
  <div class="flex h-18 items-center gap-3 px-2">
    <img [src]="branding.logoUrl" alt="" class="size-8" />
    <span class="font-display text-lg font-semibold tracking-tight">{{ branding.productName }}</span>
  </div>

  <ul class="mt-4 flex flex-col gap-1">
    @for (item of items(); track item.label) {
      <li>
        <a
          [routerLink]="item.link"
          routerLinkActive
          #link="routerLinkActive"
          class="flex items-center gap-3 rounded-control px-3 py-2 text-sm font-semibold focus-visible:ring-3 focus-visible:ring-accent-200 focus-visible:outline-none"
          [class]="link.isActive ? 'bg-accent-100 text-accent-700' : 'text-ink-muted hover:bg-surface-muted hover:text-ink'"
        >
          <svg class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
          @if (item.count) {
            <span
              class="ml-auto min-w-6 rounded-full bg-accent-600 px-2 py-0.5 text-center text-xs font-semibold text-white"
              [attr.aria-label]="item.count + ' new'"
            >
              {{ item.count }}
            </span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
